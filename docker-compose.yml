# SQL Server para desenvolvimento local.
# Apenas o banco roda em container; backend e frontend rodam na máquina.
# Senha padrão fictícia e exclusiva deste ambiente local (pode ser sobrescrita via .env).
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-Curriculos_Dev_2026!}
    ports:
      # Porta 14330 no host para não conflitar com um SQL Server já instalado na 1433.
      - "${MSSQL_HOST_PORT:-14330}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  sqlserver-data:
